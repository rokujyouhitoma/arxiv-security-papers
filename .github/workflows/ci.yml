name: CI Pipeline & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-differential-gates:
    name: Mandatory Quality Gates & Dual-Backend Parity
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Virtualenv Symlink for Makefile Compatibility
        run: |
          if [ ! -d ".venv" ]; then
            python -m venv .venv
            .venv/bin/pip install -r requirements.txt
          fi

      - name: Quality Gate 1 - Format Verification (isort, black, flake8)
        run: make check_format

      - name: Quality Gate 2 - Strict Static Analysis (radon, xenon, mypy, py_compile)
        run: make static_analysis

      - name: Quality Gate 3 - Fast Unit & Integration Tests
        run: make test

      - name: Quality Gate 4 - Dual-Backend Differential Migration Parity (PyDB vs SQLite)
        run: make migrations-diff-test

      - name: Quality Gate 5 - Database Compatibility Differential Audit
        run: make differential_audit
