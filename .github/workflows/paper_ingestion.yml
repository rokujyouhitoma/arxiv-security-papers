name: ArXiv Security Papers Ingestion Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ingest-and-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pipeline with W3C Context Propagation
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_SERVICE_NAME: "arxiv-security-papers-pipeline"
        run: |
          # Generate W3C Trace Context (traceparent) and inject into environment
          TRACE_ID=$(openssl rand -hex 16)
          SPAN_ID=$(openssl rand -hex 8)
          export TRACEPARENT="00-${TRACE_ID}-${SPAN_ID}-01"
          
          echo "Propagating TRACEPARENT=${TRACEPARENT}"
          PYTHONPATH=src python -m pipeline.arxiv_okf_fetcher
