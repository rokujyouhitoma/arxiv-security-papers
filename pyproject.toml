[tool.poetry]
name = "arxiv-security-papers"
version = "0.2.0"
description = "arXiv CS Security (cs.CR) Multi-Tiered OKF & Executive Summary Generator"
authors = ["IKE Tohru <rokujyouhitomajp@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "arxiv_okf_fetcher", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.9"

[tool.poetry.dev-dependencies]
black = "^24.0"
flake8 = "^7.0"
isort = "^5.13"
pytest = "^8.0"
pytest-cov = "^5.0"
mypy = "^1.8"
radon = "^6.0"
xenon = "^0.9"
taskipy = "^1.12"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.taskipy.tasks]
format = { cmd = "task flake8", help = "format code" }
flake8 = "flake8 --max-line-length=120 src tests"
mypy = "mypy src"

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
