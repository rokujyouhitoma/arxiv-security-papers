[tool.poetry]
name = "arxiv-security-papers"
version = "0.2.0"
description = "arXiv CS Security (cs.CR) Multi-Tiered OKF & Executive Summary Generator"
authors = ["IKE Tohru <rokujyouhitomajp@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "arxiv_okf_fetcher", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.14"

[tool.poetry.dev-dependencies]
black = "^26.0"
flake8 = "^7.0"
isort = "^8.0"
pytest = "^9.0"
pytest-cov = "^7.0"
pytest-xdist = "^3.5"
mypy = "^2.0"
radon = "^6.0"
xenon = "^0.9"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
mypy_path = "src"
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
